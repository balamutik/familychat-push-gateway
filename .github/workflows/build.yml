name: Build push gateway
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Test and validate
        run: |
          test -z "$(gofmt -l cmd internal)"
          go test -race ./...
          go vet ./...
          python3 -m unittest discover -s scripts/tests -v
          bash -n install.sh scripts/*.sh
          docker compose --env-file .env.example config --quiet
      - name: Build Linux binaries and deployment bundle
        run: bash scripts/build-artifacts.sh
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == 'balamutik/familychat-push-gateway'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build multi-platform Docker image
        id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == 'balamutik/familychat-push-gateway' }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest
          outputs: type=oci,dest=dist/familychat-push-gateway.oci.tar
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Record published image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == 'balamutik/familychat-push-gateway'
        env:
          IMAGE: ghcr.io/${{ github.repository }}@${{ steps.image.outputs.digest }}
          REVISION: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path('dist/published-image.json').write_text(json.dumps({'image':os.environ['IMAGE'], 'revision':os.environ['REVISION']}, indent=2)+'\n')
          PY
      - name: Verify anonymous registry access
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == 'balamutik/familychat-push-gateway'
        env:
          IMAGE: ghcr.io/${{ github.repository }}@${{ steps.image.outputs.digest }}
        run: |
          anonymous_config=$(mktemp -d)
          trap 'rm -rf "$anonymous_config"' EXIT
          DOCKER_CONFIG="$anonymous_config" docker manifest inspect "$IMAGE" > /dev/null
          DOCKER_CONFIG="$anonymous_config" docker pull "$IMAGE"
          pinned_image=$(python3 -c 'import json; print(json.load(open("image.json"))["image"])')
          DOCKER_CONFIG="$anonymous_config" docker pull "$pinned_image"
      - name: Calculate checksums
        working-directory: dist
        run: |
          sha256sum *.tar.gz *.oci.tar > SHA256SUMS
          if [ -f published-image.json ]; then sha256sum published-image.json >> SHA256SUMS; fi
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: push-gateway-build-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
